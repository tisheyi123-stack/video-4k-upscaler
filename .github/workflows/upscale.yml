name: 4K AI Video Upscaler

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Direct URL to input video'
        required: true
      chat_id:
        description: 'Telegram Chat ID to send result'
        required: true
      bot_token:
        description: 'Telegram Bot Token'
        required: true

jobs:
  upscale:
    runs-on: ubuntu-latest
    steps:
      - name: Notify processing started
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ inputs.bot_token }}/sendMessage" \
            -d chat_id="${{ inputs.chat_id }}" \
            -d text="⚡️ سرور قدرتمند گیت‌هاب روشن شد!\n⚙️ در حال آماده‌سازی موتور هوش مصنوعی CPU (PyTorch Real-ESRGAN)..."

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg wget
          pip install --no-cache-dir torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install --no-cache-dir basicsr facexlib gfpgan realesrgan

      - name: Download Video
        run: |
          wget -q -O input.mp4 "${{ inputs.video_url }}"

      - name: Process Video to 4K (PyTorch CPU)
        run: |
          python -c "
          import os, subprocess, torch
          from realesrgan import RealESRGANer
          from basicsr.archs.rrdbnet_arch import RRDBNet

          print('Running PyTorch Real-ESRGAN on CPU...')
          cmd = [
              'python', '-m', 'realesrgan.inference_realesrgan_video',
              '-i', 'input.mp4',
              '-o', 'output_4k.mp4',
              '-n', 'RealESRGAN_x4plus',
              '-s', '4',
              '--device', 'cpu'
          ]
          subprocess.run(cmd, check=True)
          "

      - name: Send 4K Video to Telegram
        if: success()
        run: |
          curl -F chat_id="${{ inputs.chat_id }}" \
               -F document=@output_4k.mp4 \
               -F caption="💎 ویدیوی شما با سرور گیت‌هاب با موفقیت به کیفیت 4K ارتقا یافت!" \
               "https://api.telegram.org/bot${{ inputs.bot_token }}/sendDocument"

      - name: Notify failure
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ inputs.bot_token }}/sendMessage" \
            -d chat_id="${{ inputs.chat_id }}" \
            -d text="❌ متاسفانه پردازش ویدیو در سرور گیت‌هاب با خطا مواجه شد."
