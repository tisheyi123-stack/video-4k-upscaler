name: 4K AI Video Upscaler

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Direct URL to input video'
        required: true
      chat_id:
        description: 'Telegram Chat ID to send result'
        required: true
      bot_token:
        description: 'Telegram Bot Token'
        required: true

jobs:
  upscale:
    runs-on: ubuntu-latest
    steps:
      - name: Notify processing started
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ inputs.bot_token }}/sendMessage" \
            -d chat_id="${{ inputs.chat_id }}" \
            -d text="⚡️ سرور قدرتمند گیت‌هاب (16GB RAM) روشن شد!\n⚙️ در حال استخراج فریم‌ها و بازسازی به کیفیت 4K با هوش مصنوعی..."

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg wget

      - name: Download Real-ESRGAN Vulkan
        run: |
          wget -q https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.5.0/realesrgan-ncnn-vulkan-20220424-ubuntu.zip
          unzip -q realesrgan-ncnn-vulkan-20220424-ubuntu.zip
          chmod +x realesrgan-ncnn-vulkan

      - name: Download Video
        run: |
          wget -q -O input.mp4 "${{ inputs.video_url }}"

      - name: Process Video to 4K
        run: |
          mkdir -p in_frames out_frames
          ffmpeg -y -i input.mp4 -vn -c:a copy audio.aac || true
          ffmpeg -y -i input.mp4 -qscale:v 2 in_frames/frame_%05d.jpg
          ./realesrgan-ncnn-vulkan -i in_frames -o out_frames -n realesr-animevideov3 -s 4 || \
          ./realesrgan-ncnn-vulkan -i in_frames -o out_frames -n realesrgan-x4plus -s 4
          if [ -f audio.aac ]; then
            ffmpeg -y -framerate 30 -i out_frames/frame_%05d.jpg -i audio.aac -c:v libx264 -pix_fmt yuv420p -crf 18 -c:a copy output_4k.mp4
          else
            ffmpeg -y -framerate 30 -i out_frames/frame_%05d.jpg -c:v libx264 -pix_fmt yuv420p -crf 18 output_4k.mp4
          fi

      - name: Send 4K Video to Telegram
        run: |
          curl -F chat_id="${{ inputs.chat_id }}" \
               -F document=@output_4k.mp4 \
               -F caption="💎 ویدیوی شما با سرور 16GB گیت‌هاب به کیفیت 4K واقعی ارتقا یافت!" \
               "https://api.telegram.org/bot${{ inputs.bot_token }}/sendDocument"
